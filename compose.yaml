services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mizero_tss
      MYSQL_USER: mizero_app
      MYSQL_PASSWORD: local-dev-password
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/migrations/001_create_signup.sql:/docker-entrypoint-initdb.d/001_create_signup.sql:ro
      - ./backend/migrations/002_create_login_history.sql:/docker-entrypoint-initdb.d/002_create_login_history.sql:ro
      - ./backend/migrations/003_add_staff_role.sql:/docker-entrypoint-initdb.d/003_add_staff_role.sql:ro
      - ./backend/migrations/004_create_students_and_attendance.sql:/docker-entrypoint-initdb.d/004_create_students_and_attendance.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-plocal-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: mizero_app
      DB_PASSWORD: local-dev-password
      DB_NAME: mizero_tss
      JWT_SECRET: local-docker-development-secret-change-before-deployment
      PORT: 3000
    volumes:
      - ./backend/index.js:/app/backend/index.js
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  mysql_data:
  frontend_node_modules:
